apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, labels: {app: backend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend, tier: api}}
    spec:
      containers:
      - name: backend
        image: mirror.gcr.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/healthz && echo '{\"orders\":42}' > /www/orders && exec httpd -f -p 8080 -h /www"]
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 3}
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, labels: {app: frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: mirror.gcr.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "wget -q -T 3 -O /dev/null \"$BACKEND_URL/healthz\" || { echo \"FATAL: cannot reach backend at $BACKEND_URL\" >&2; exit 1; }; mkdir -p /www && echo ok > /www/healthz && exec httpd -f -p 8080 -h /www"]
        env: [{name: BACKEND_URL, value: "http://backend:8080"}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, labels: {app: worker}}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: mirror.gcr.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "while true; do echo processed batch; sleep 30; done"]
        resources: {requests: {cpu: "48", memory: 96Gi}, limits: {cpu: "48", memory: 96Gi}}
