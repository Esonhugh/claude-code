    <rect x="3" y="6" width="1.5" height="1.5" />
    <rect x="6" y="6" width="4.5" height="1.5" />
    <rect x="12" y="6" width="1.5" height="1.5" />
    <rect x="1.5" y="7.5" width="13.5" height="1.5" />
    <rect x="3" y="9" width="10.5" height="1.5" />
    <rect x="3" y="10.5" width="1.5" height="1.5" />
    <rect x="6" y="10.5" width="1.5" height="1.5" />
    <rect x="9" y="10.5" width="1.5" height="1.5" />
    <rect x="12" y="10.5" width="1.5" height="1.5" />
  </g>
</svg>
