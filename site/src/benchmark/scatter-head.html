<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

.shape{display:inline-flex;align-items:center;gap:6px}
.chartbox{position:relative}

.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:210px;z-index:2}

:root:is([data-lang="zh"],[data-lang="hans"]) .en,:root:not([data-lang="zh"]) .hant,:root:not([data-lang="hans"]) .hans{display:none!important}
