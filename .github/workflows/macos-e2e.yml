name: macOS e2e

# Every PR: the Seatbelt sandbox is not exercised on Linux or Windows CI.
on:
  workflow_dispatch:
  pull_request:

jobs:
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.295
      # The official build the fork is compared with.
      OFFICIAL_CLAUDE_VERSION: 2.1.311
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bfs and ugrep
        run: |
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          bun ./scripts/build-search-tools.mjs
          dist/search-tools/*-darwin-arm64/ugrep --version
          dist/search-tools/*-darwin-arm64/bfs --version

      - name: Build binary
        env:
          CLAUDE_CODE_REQUIRE_SEARCH_TOOLS: '1'
        run: |
          bun run build
          bun run package:binary

      - name: DIAG example.com TLS (temporary, #753)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -x
          sw_vers; which -a curl; /usr/bin/curl -V
          /usr/bin/curl -sS -o /dev/null -w '%{http_code}\n' https://example.com || true
          /usr/bin/curl -sS --cacert /etc/ssl/cert.pem -o /dev/null -w '%{http_code}\n' https://example.com || true
          CURL_SSL_BACKEND=securetransport /usr/bin/curl -sS -o /dev/null -w '%{http_code}\n' https://example.com || true
          echo | openssl s_client -connect example.com:443 -servername example.com -showcerts 2>&1 | grep -E '^ *[0-9] s:|^ *i:|Verify return|NotAfter|v:NotBefore' || true
          printf '(version 1)\n(allow default)\n(deny mach-lookup (global-name "com.apple.trustd.agent"))\n' > /tmp/no-trustd.sb
          sandbox-exec -f /tmp/no-trustd.sb /usr/bin/curl -sS -o /dev/null -w 'no-trustd %{http_code}\n' https://example.com || true
          printf '(version 1)\n(allow default)\n' > /tmp/all.sb
          sandbox-exec -f /tmp/all.sb /usr/bin/curl -sS -o /dev/null -w 'allow-all %{http_code}\n' https://example.com || true
          for svc in "com.apple.trustd com.apple.trustd.agent com.apple.SecurityServer com.apple.securityd.xpc" "com.apple.trustd com.apple.trustd.agent com.apple.SecurityServer" "com.apple.trustd com.apple.trustd.agent com.apple.securityd.xpc"; do
            { echo '(version 1)'; echo '(allow default)'; for n in $svc; do echo "(deny mach-lookup (global-name \"$n\"))"; done; } > /tmp/deny.sb
            sandbox-exec -f /tmp/deny.sb /usr/bin/curl -sS -o /dev/null -w "deny[$svc] %{http_code}\n" https://example.com 2>&1 | tail -1
          done
          { echo '(version 1)'; echo '(allow default)'; echo '(deny mach-lookup)'; echo '(allow mach-lookup (global-name "com.apple.trustd") (global-name "com.apple.trustd.agent"))'; } > /tmp/only-trustd.sb
          sandbox-exec -f /tmp/only-trustd.sb /usr/bin/curl -sS -o /dev/null -w "only-trustd %{http_code}\n" https://example.com 2>&1 | tail -1
          { echo '(version 1)'; echo '(allow default)'; echo '(deny mach-lookup)'; echo '(allow mach-lookup (global-name "com.apple.SecurityServer") (global-name "com.apple.securityd.xpc"))'; } > /tmp/only-secd.sb
          sandbox-exec -f /tmp/only-secd.sb /usr/bin/curl -sS -o /dev/null -w "only-securityd %{http_code}\n" https://example.com 2>&1 | tail -1
          { echo '(version 1)'; echo '(allow default)'; echo '(deny mach-lookup)'; echo '(allow mach-lookup (global-name "com.apple.trustd.agent"))'; } > /tmp/only-agent.sb
          sandbox-exec -f /tmp/only-agent.sb /usr/bin/curl -sS -o /dev/null -w "only-trustd.agent %{http_code}\n" https://example.com 2>&1 | tail -1
          { echo '(version 1)'; echo '(allow default)'; echo '(deny mach-lookup)'; echo '(allow mach-lookup (global-name "com.apple.trustd"))'; } > /tmp/only-sys.sb
          sandbox-exec -f /tmp/only-sys.sb /usr/bin/curl -sS -o /dev/null -w "only-trustd(system) %{http_code}\n" https://example.com 2>&1 | tail -1
          security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain > /tmp/roots.pem; grep -c BEGIN /tmp/roots.pem
          CURL_CA_BUNDLE=/tmp/roots.pem sandbox-exec -f /tmp/deny-all-mach.sb /usr/bin/curl -sS -o /dev/null -w "deny-all-mach+roots.pem %{http_code}\n" https://example.com 2>&1 | tail -1
          SSL_CERT_FILE=/tmp/roots.pem sandbox-exec -f /tmp/deny-all-mach.sb /usr/bin/curl -sS -o /dev/null -w "deny-all-mach+SSL_CERT_FILE %{http_code}\n" https://example.com 2>&1 | tail -1
          SSL_CERT_FILE=/tmp/roots.pem sandbox-exec -f /tmp/deny-all-mach.sb /usr/bin/python3 -c "import urllib.request;print('python', urllib.request.urlopen('https://example.com').status)" 2>&1 | tail -1
          sandbox-exec -f /tmp/deny-all-mach.sb /usr/bin/git ls-remote https://github.com/actions/checkout HEAD 2>&1 | tail -1
          sandbox-exec -f /tmp/deny-all-mach.sb /usr/bin/python3 -c "import urllib.request;print('python-noenv', urllib.request.urlopen('https://example.com').status)" 2>&1 | tail -1
          echo | openssl s_client -connect example.com:443 -servername example.com -CAfile /etc/ssl/cert.pem 2>&1 | grep -E 'Verify return|depth' 
          grep -c 'BEGIN CERT' /etc/ssl/cert.pem; grep -n 'AAA Certificate Services\|SSL.com TLS ECC Root CA 2022' /etc/ssl/cert.pem | head
          for h in www.apple.com www.google.com api.anthropic.com registry.npmjs.org pypi.org; do
            sandbox-exec -f /tmp/no-trustd.sb /usr/bin/curl -sS -o /dev/null -w "no-trustd $h %{http_code}\n" https://$h || true
          done
          cat > /tmp/diag.sh <<'SH'
          echo "== sandbox chain"; curl -sk -w '%{certs}' -o /dev/null https://example.com | grep -E '^(Subject|Issuer):' 
          for h in www.apple.com www.google.com registry.npmjs.org pypi.org api.anthropic.com; do curl -sS -o /dev/null -w "sandbox $h %{http_code}\n" https://$h 2>&1 | tail -1; done
          SH
          sed -i '' "s#bash('curl -sS -o /dev/null -w \"%{http_code}\" https://example.com')#bash('bash /tmp/diag.sh')#" scripts/macos-sandbox-e2e.ts
          grep -n diag.sh scripts/macos-sandbox-e2e.ts
          bun scripts/macos-sandbox-e2e.ts dist/release/claude-code-v*-darwin-arm64 | head -70 || true
          git checkout scripts/macos-sandbox-e2e.ts

      - name: Sandbox e2e
        run: bun scripts/macos-sandbox-e2e.ts dist/release/claude-code-v*-darwin-arm64

      # Playwright is not a project dependency; it is added for this step only.
      - name: Web e2e
        if: ${{ !cancelled() }}
        run: |
          bun add --no-save playwright@1.63.0
          bunx playwright install chromium
          CLAUDE_WEB_BINARY="$(ls "$PWD"/dist/release/claude-code-v*-darwin-arm64 | head -n 1)" bun test --timeout 300000 src/web/web.binary.test.ts

      # For comparison only: its failures do not fail the job.
      - name: Download official
        if: ${{ !cancelled() }}
        run: |
          mkdir -p official
          cd official
          tgz=$(bunx npm pack "@anthropic-ai/claude-code-darwin-arm64@$OFFICIAL_CLAUDE_VERSION" | tail -n 1)
          tar -xzf "$tgz"
          cp "$(find package -name claude -type f | head -n 1)" claude
          chmod +x claude
          ./claude --version

      - name: Official sandbox e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun scripts/macos-sandbox-e2e.ts official/claude --official
