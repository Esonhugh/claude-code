name: macOS e2e

# Every PR: the Seatbelt sandbox is not exercised on Linux or Windows CI.
on:
  workflow_dispatch:
  pull_request:

jobs:
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.295
      # The official build the fork is compared with.
      OFFICIAL_CLAUDE_VERSION: 2.1.311
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bfs and ugrep
        run: |
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          bun ./scripts/build-search-tools.mjs
          dist/search-tools/*-darwin-arm64/ugrep --version
          dist/search-tools/*-darwin-arm64/bfs --version

      - name: Build binary
        env:
          CLAUDE_CODE_REQUIRE_SEARCH_TOOLS: '1'
        run: |
          bun run build
          bun run package:binary

      - name: DIAG example.com TLS (temporary, #753)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -x
          { echo '(version 1)'; echo '(allow default)'; echo '(deny mach-lookup (global-name "com.apple.TrustEvaluationAgent"))'; } > /tmp/no-tea.sb
          sandbox-exec -f /tmp/no-tea.sb /usr/bin/curl -sS -o /dev/null -w "no-TEA %{http_code}\n" https://example.com 2>&1 | tail -1
          sandbox-exec -f /tmp/no-tea.sb /usr/bin/curl -sS -o /dev/null -w "no-TEA google %{http_code}\n" https://www.google.com 2>&1 | tail -1
          security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain > /tmp/roots.pem
          CURL_CA_BUNDLE=/tmp/roots.pem sandbox-exec -f /tmp/no-tea.sb /usr/bin/curl -sS -o /dev/null -w "no-TEA+bundle %{http_code}\n" https://example.com 2>&1 | tail -1
          sed "s/strictAllowlist: true }/strictAllowlist: true, allowMachLookup: ['com.apple.TrustEvaluationAgent'] }/" scripts/macos-sandbox-e2e.ts > scripts/e2e-tea.ts
          grep -n allowMachLookup scripts/e2e-tea.ts
          bun scripts/e2e-tea.ts dist/release/claude-code-v*-darwin-arm64 2>&1 | grep -A1 'example.com' | head -4 || true
          CURL_CA_BUNDLE=/tmp/roots.pem bun scripts/macos-sandbox-e2e.ts dist/release/claude-code-v*-darwin-arm64 2>&1 | grep -A1 'example.com' | head -4 || true
          rm -f scripts/e2e-tea.ts

      - name: Sandbox e2e
        run: bun scripts/macos-sandbox-e2e.ts dist/release/claude-code-v*-darwin-arm64

      # Playwright is not a project dependency; it is added for this step only.
      - name: Web e2e
        if: ${{ !cancelled() }}
        run: |
          bun add --no-save playwright@1.63.0
          bunx playwright install chromium
          CLAUDE_WEB_BINARY="$(ls "$PWD"/dist/release/claude-code-v*-darwin-arm64 | head -n 1)" bun test --timeout 300000 src/web/web.binary.test.ts

      # For comparison only: its failures do not fail the job.
      - name: Download official
        if: ${{ !cancelled() }}
        run: |
          mkdir -p official
          cd official
          tgz=$(bunx npm pack "@anthropic-ai/claude-code-darwin-arm64@$OFFICIAL_CLAUDE_VERSION" | tail -n 1)
          tar -xzf "$tgz"
          cp "$(find package -name claude -type f | head -n 1)" claude
          chmod +x claude
          ./claude --version

      - name: Official sandbox e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun scripts/macos-sandbox-e2e.ts official/claude --official
