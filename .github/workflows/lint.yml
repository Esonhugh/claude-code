name: Lint

# Runs the same eslint and tsc steps as `make release-check` so lint and type
# errors are caught before they reach dev.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CLAUDE-workflow.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        # src/web/assets.ts imports the generated web/dist/assets.json.
        run: |
          bun run build:web
          bunx tsc --noEmit --pretty false
