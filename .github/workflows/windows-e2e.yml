name: Windows e2e

# Every PR: fork features are rarely run on Windows otherwise.
on:
  workflow_dispatch:
  pull_request:

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        shell: bash
        run: |
          bun run build
          bun run package:binary

      - name: Sandbox e2e
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Features e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-features-e2e.ts dist/release/claude-code-v*-win32-x64.exe
