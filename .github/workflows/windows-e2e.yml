name: Windows e2e

# Every PR: fork features are rarely run on Windows otherwise.
on:
  workflow_dispatch:
  pull_request:

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.294
      # The official build the fork is compared with.
      OFFICIAL_CLAUDE_VERSION: 2.1.303
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        shell: bash
        run: |
          bun run build
          bun run package:binary

      - name: Sandbox e2e
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Features e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-features-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Sessions e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-sessions-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Upload binary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fork-win32-x64
          path: dist/release/claude-code-v*-win32-x64.exe
          retention-days: 1

  # The official binary runs the same scripts on a clean runner (its sandbox
  # install would conflict with the fork's), for comparison only: its failures
  # (fork-only tools, Direct Connect) do not fail the job. The fork's sandbox
  # e2e then runs on top of the official install.
  official:
    needs: windows-e2e
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OFFICIAL_CLAUDE_VERSION: 2.1.303
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Download official
        shell: bash
        run: |
          mkdir -p official
          cd official
          tgz=$(bunx npm pack "@anthropic-ai/claude-code-win32-x64@$OFFICIAL_CLAUDE_VERSION" | tail -n 1)
          tar -xzf "$tgz"
          cp "$(find package -name claude.exe | head -n 1)" claude.exe
          ./claude.exe --version

      - name: Official sandbox e2e
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts official/claude.exe

      - name: Official features e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-features-e2e.ts official/claude.exe

      - name: Official sessions e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sessions-e2e.ts official/claude.exe

      - name: Download fork binary
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: fork-win32-x64
          path: fork

      - name: Fork sandbox e2e after the official install
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts fork/claude-code-v*-win32-x64.exe
