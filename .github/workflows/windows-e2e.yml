name: Windows e2e

# Every PR: fork features are rarely run on Windows otherwise.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CLAUDE-workflow.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.294
      # The official build the fork is compared with.
      OFFICIAL_CLAUDE_VERSION: 2.1.303
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # The default cache is on C:, the checkout on D:, so bun copies every
        # file instead of hard-linking it.
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      # React Compiler output of unchanged files (scripts/build.mjs); a
      # push to dev seeds it for every PR (build-cache.yml).
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/claude-build-transform
          key: build-transform-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: build-transform-${{ runner.os }}-${{ runner.arch }}-

      # package:binary runs the build itself.
      - name: Build binary
        shell: bash
        run: bun run package:binary

      - name: Sandbox e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Features e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-features-e2e.ts dist/release/claude-code-v*-win32-x64.exe

      - name: Sessions e2e
        if: ${{ !cancelled() }}
        shell: bash
        run: bun scripts/windows-sessions-e2e.ts dist/release/claude-code-v*-win32-x64.exe

  # On its own runner, without the WFP filters the sandbox steps install, and
  # alongside windows-e2e instead of before its sandbox steps.
  web-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # The default cache is on C:, the checkout on D:, so bun copies every
        # file instead of hard-linking it.
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      # React Compiler output of unchanged files (scripts/build.mjs); a
      # push to dev seeds it for every PR (build-cache.yml).
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/claude-build-transform
          key: build-transform-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: build-transform-${{ runner.os }}-${{ runner.arch }}-

      - name: Build binary
        shell: bash
        run: bun run package:binary

      # Playwright is not a project dependency; it is added for this step only.
      - name: Web e2e
        shell: bash
        run: |
          bun add --no-save playwright@1.63.0
          bunx playwright install chromium
          CLAUDE_WEB_BINARY="$(cygpath -m "$(ls "$PWD"/dist/release/claude-code-v*-win32-x64.exe | head -n 1)")" bun test --timeout 300000 src/web/web.binary.test.ts

  # The official binary runs the same scripts on a clean runner (its sandbox
  # install would conflict with the fork's), for comparison only: its failures
  # (fork-only tools, Direct Connect) do not fail the job. The fork's sandbox
  # e2e then runs on top of the official install. It builds the fork itself so
  # it runs alongside windows-e2e instead of after it.
  official:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: 2.1.294
      OFFICIAL_CLAUDE_VERSION: 2.1.303
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # The default cache is on C:, the checkout on D:, so bun copies every
        # file instead of hard-linking it.
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      # React Compiler output of unchanged files (scripts/build.mjs); a
      # push to dev seeds it for every PR (build-cache.yml).
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/claude-build-transform
          key: build-transform-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: build-transform-${{ runner.os }}-${{ runner.arch }}-

      # Before the official sandbox install, which adds WFP filters.
      - name: Build fork binary
        shell: bash
        run: bun run package:binary

      - name: Download official
        shell: bash
        run: |
          mkdir -p official
          cd official
          tgz=$(bunx npm pack "@anthropic-ai/claude-code-win32-x64@$OFFICIAL_CLAUDE_VERSION" | tail -n 1)
          tar -xzf "$tgz"
          cp "$(find package -name claude.exe | head -n 1)" claude.exe
          ./claude.exe --version

      - name: Official sandbox e2e
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts official/claude.exe

      - name: Official features e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-features-e2e.ts official/claude.exe

      - name: Official sessions e2e
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sessions-e2e.ts official/claude.exe

      - name: Fork sandbox e2e after the official install
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: bun scripts/windows-sandbox-e2e.ts dist/release/claude-code-v*-win32-x64.exe
