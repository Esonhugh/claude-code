name: Windows sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-sandbox.yml'
      - 'scripts/windows-sandbox-*'

jobs:
  windows-sandbox:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe
        run: bun scripts/windows-sandbox-probe.ts
