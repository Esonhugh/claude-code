name: Re-run jobs that got no runner

# Hosted macOS arm64 runners are sometimes out of capacity: the job then ends
# after ~15 minutes with "The job was not acquired by Runner" and no steps, and
# the whole run reads failure. Re-run such jobs once; real failures are left.
# workflow_run always uses this file from the default branch.
on:
  workflow_run:
    workflows: [macOS e2e, Windows e2e, Unit tests, Lint, Linux sandbox tests]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run jobs that never started
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          unacquired="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select((.conclusion == "failure" or .conclusion == "cancelled") and (.runner_id // 0) == 0 and (.steps | length) == 0)] | length')"
          echo "jobs that got no runner: $unacquired"
          [ "$unacquired" -gt 0 ] || exit 0
          # Re-running an older run would cancel a newer one in its concurrency group.
          latest="$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id')"
          if [ "$latest" != "$RUN_ID" ]; then
            echo "run $latest is newer than $RUN_ID; not re-running"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
