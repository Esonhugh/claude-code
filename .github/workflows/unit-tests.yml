name: Unit tests

# Every bun unit test file, each in its own process (module mocks leak across
# files in one process). The bwrap network tests run in linux-sandbox-tests.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CLAUDE-workflow.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Split across runners by measured time: on one runner this took ~18 min.
  unit-tests-shard:
    name: unit-tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      # A fresh checkout leaves every index entry racily clean, and the
      # --no-optional-locks Git calls under test never save a refresh, so each
      # one rehashes the whole tree (get_workspace_diff ran past 5s under load).
      - name: Refresh the Git index
        run: git update-index -q --refresh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The rg the binary embeds, on PATH; saves an apt-get update per shard.
      - name: Put ripgrep on PATH
        run: |
          echo "$PWD/node_modules/@vscode/ripgrep-linux-x64/bin" >> "$GITHUB_PATH"
          "$PWD/node_modules/@vscode/ripgrep-linux-x64/bin/rg" --version

      - name: Run unit tests
        # bun test sets NODE_ENV=test, where a missing Claude credential is an
        # error; tests that need no credential or OAuth set up their own.
        env:
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
        run: |
          mkdir -p "$RUNNER_TEMP/unit"
          git ls-files 'src/**/*.test.ts' 'src/**/*.test.tsx' 'web/src/**/*.test.ts' 'bench/**/*.test.ts' \
            | grep -vxF -e src/utils/permissions/permissions.networkLists.test.ts -e src/utils/sandbox/sandbox-adapter.test.ts \
            | bun scripts/split-unit-tests.mjs ${{ matrix.shard }} 5 \
            > "$RUNNER_TEMP/unit/files.txt"
          export LOGS="$RUNNER_TEMP/unit"
          xargs -P 4 -I{} sh -c 'log="$LOGS/$(echo "$1" | tr / _).log"; s=$(date +%s.%N); bun test --timeout 60000 "$1" >"$log" 2>&1 || echo "$1" >>"$LOGS/failed.txt"; printf "%.1f\t%s\n" "$(echo "$(date +%s.%N) $s" | awk "{print \$1 - \$2}")" "$1" >>"$LOGS/times.tsv"' _ {} \
            < "$RUNNER_TEMP/unit/files.txt"
          echo "$(wc -l < "$RUNNER_TEMP/unit/files.txt") test files"
          # The lines .github/unit-test-times.tsv is made of.
          echo "::group::test times"
          sort -rn "$LOGS/times.tsv"
          echo "::endgroup::"
          if [ -s "$LOGS/failed.txt" ]; then
            while read -r f; do
              echo "::group::FAIL $f"
              cat "$LOGS/$(echo "$f" | tr / _).log"
              echo "::endgroup::"
            done < "$LOGS/failed.txt"
            echo "Failed files:"; cat "$LOGS/failed.txt"
            exit 1
          fi

  # The single check the shards report under; skipped, not failed, when a newer
  # push cancels the run.
  unit-tests:
    needs: unit-tests-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit-tests-shard.result }}" = success

  # src/web/web.binary.test.ts drives the built binary's `claude web` from
  # Chromium; it is skipped above, where CLAUDE_WEB_BINARY is unset.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A 0.0.0-dev build is refused by the minimum-version check.
      CLAUDE_CODE_VERSION: 2.1.296
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Put ripgrep on PATH
        run: echo "$PWD/node_modules/@vscode/ripgrep-linux-x64/bin" >> "$GITHUB_PATH"

      # Playwright is not a project dependency; it is added for this job only.
      - name: Install Playwright Chromium
        run: |
          bun add --no-save playwright@1.63.0
          bunx playwright install --with-deps chromium

      # React Compiler output of unchanged files (scripts/build.mjs); a
      # push to dev seeds it for every PR (build-cache.yml).
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/claude-build-transform
          key: build-transform-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: build-transform-${{ runner.os }}-${{ runner.arch }}-

      # package:binary runs the build itself.
      - name: Build binary
        run: bun run package:binary

      - name: Web e2e
        run: CLAUDE_WEB_BINARY="$(ls "$PWD"/dist/release/claude-code-v*-linux-x64 | head -n 1)" bun test --timeout 300000 src/web/web.binary.test.ts
